# WALL-E: bound how long a shutdown waits for a unit that ignores SIGTERM.
# Installed as /etc/systemd/system.conf.d/10-walle-fast-stop.conf by
# bin/install_walle_ups.sh. Units that set TimeoutStopSec themselves keep it
# (wall-e.service: 90 s, but the UPS watcher kills it before a halt).
[Manager]
DefaultTimeoutStopSec=30s
