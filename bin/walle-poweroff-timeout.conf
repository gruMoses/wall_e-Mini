# WALL-E: a power-off that hangs in userspace is forced after 60 s.
# Installed as /etc/systemd/system/poweroff.target.d/10-walle-timeout.conf by
# bin/install_walle_power.sh. The timer starts when the poweroff job is queued
# (the default on the Pi is 30 min). See docs/x1202_power_watcher_design.md.
[Unit]
JobTimeoutSec=60s
JobTimeoutAction=poweroff-force
