# WALL-E: bound how long a shutdown waits for a desktop-session service.
# Installed as /etc/systemd/user.conf.d/10-walle-fast-stop.conf by
# bin/install_walle_ups.sh. On 2026-11-04 xdg-document-portal.service hung on
# stop and held a mains-loss shutdown for 85 s (the default is 90 s).
[Manager]
DefaultTimeoutStopSec=10s
