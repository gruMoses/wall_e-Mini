<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speed Segmented Control — WALL-E Drive</title>
<style>
:root{
  --bg:#080a0f;--s1:#111318;--s2:#1a1d27;--bd:#252836;
  --blue:#2563eb;--blue-md:rgba(37,99,235,.32);
  --text:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:700 13px/1 -apple-system,"SF Pro Display",system-ui,sans-serif;
  padding:28px 20px 36px;}
.card-title{font-size:10px;letter-spacing:.14em;color:var(--t3);margin-bottom:24px;}
.states{display:flex;flex-direction:column;gap:22px;}
.state-label{font-size:9px;letter-spacing:.12em;color:var(--t3);margin-bottom:8px;text-transform:uppercase;}

/* ---- speed seg (copied from source) ---- */
.spd-seg{
  display:flex;flex-shrink:0;
  background:var(--s1);border:1px solid var(--bd);
  border-radius:10px;padding:3px;gap:2px;
}
.seg{
  flex:1;padding:8px 2px;border:none;border-radius:7px;
  background:transparent;color:var(--t3);
  font:700 10px/1 inherit;letter-spacing:.1em;
  transition:background .14s,color .14s,box-shadow .14s;
}
.seg.on{background:var(--blue);color:#fff;box-shadow:0 2px 10px var(--blue-md);}

.note{font-size:10px;color:var(--t3);letter-spacing:.04em;margin-top:6px;}
</style>
</head>
<body>

<div class="card-title">SPEED SEGMENTED CONTROL</div>

<div class="states">

  <div>
    <div class="state-label">SLOW selected (30% speed cap) — default on connect</div>
    <div class="spd-seg">
      <button class="seg on">SLOW</button>
      <button class="seg">NORMAL</button>
      <button class="seg">FAST</button>
    </div>
    <div class="note">Server cap: 0.30 &nbsp;·&nbsp; chip shows "CAP 30%"</div>
  </div>

  <div>
    <div class="state-label">NORMAL selected (60% speed cap)</div>
    <div class="spd-seg">
      <button class="seg">SLOW</button>
      <button class="seg on">NORMAL</button>
      <button class="seg">FAST</button>
    </div>
    <div class="note">Server cap: 0.60 &nbsp;·&nbsp; chip shows "CAP 60%"</div>
  </div>

  <div>
    <div class="state-label">FAST selected (100% speed cap)</div>
    <div class="spd-seg">
      <button class="seg">SLOW</button>
      <button class="seg">NORMAL</button>
      <button class="seg on">FAST</button>
    </div>
    <div class="note">Server cap: 1.00 &nbsp;·&nbsp; chip shows "CAP 100%"</div>
  </div>

</div>
</body>
</html>
