<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-STOP — WALL-E Drive</title>
<style>
:root{
  --bg:#080a0f;--s1:#111318;--s2:#1a1d27;--bd:#252836;
  --blue:#2563eb;
  --green:#10b981;
  --red:#ef4444;--red-lo:rgba(239,68,68,.13);--red-md:rgba(239,68,68,.32);
  --text:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:700 13px/1 -apple-system,"SF Pro Display",system-ui,sans-serif;
  padding:28px 20px 36px;}
.card-title{font-size:10px;letter-spacing:.14em;color:var(--t3);margin-bottom:24px;}
.states{display:flex;flex-direction:column;gap:22px;}
.state-label{font-size:9px;letter-spacing:.12em;color:var(--t3);margin-bottom:8px;text-transform:uppercase;}

/* ---- estop (copied from source) ---- */
.estop-wrap{padding:0;}
.estop{
  width:100%;height:56px;border:none;border-radius:14px;
  background:var(--red);color:#fff;
  font:800 17px/1 inherit;letter-spacing:.14em;
  box-shadow:0 4px 22px var(--red-md),0 2px 4px rgba(0,0,0,.4);
  transition:transform .08s,box-shadow .08s;
  position:relative;overflow:hidden;
}
.estop::after{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,0);transition:background .1s;
}
.estop:active{transform:scaleY(.96);box-shadow:0 2px 10px var(--red-md);}
.estop:active::after{background:rgba(255,255,255,.08);}
.estop.latched{
  background:#fff;color:var(--red);
  box-shadow:0 0 0 3px var(--red),0 4px 22px var(--red-md);
  animation:latch 1.1s ease-in-out infinite;
}
.estop.dim1{
  background:rgba(239,68,68,.15);color:#fff;
  border:2px solid var(--red);box-shadow:none;animation:none;
}
@keyframes latch{
  0%,100%{box-shadow:0 0 0 3px var(--red),0 4px 22px var(--red-md);}
  50%{box-shadow:0 0 0 6px var(--red),0 6px 30px var(--red-md);}
}
</style>
</head>
<body>

<div class="card-title">E-STOP BUTTON — ALL STATES</div>

<div class="states">

  <!-- State 1: Idle -->
  <div>
    <div class="state-label">State 1 — Idle (ready to stop)</div>
    <div class="estop-wrap">
      <button class="estop">E &mdash; STOP</button>
    </div>
  </div>

  <!-- State 2: Latched -->
  <div>
    <div class="state-label">State 2 — Latched (pulsing; first tap required)</div>
    <div class="estop-wrap">
      <button class="estop latched">E-STOP LATCHED</button>
    </div>
  </div>

  <!-- State 3: First clear tap (bench/no RC) -->
  <div>
    <div class="state-label">State 3 — First clear tap: "tap again to clear" (3s timeout)</div>
    <div class="estop-wrap">
      <button class="estop dim1">TAP AGAIN TO CLEAR</button>
    </div>
  </div>

  <!-- State 4: RC gate — physical re-arm required -->
  <div>
    <div class="state-label">State 4 — Clear gated: RC ch3 re-arm required (RC present)</div>
    <div class="estop-wrap">
      <!-- latched style but label indicates action required -->
      <button class="estop latched">E-STOP &middot; CYCLE RC CH3</button>
    </div>
  </div>

  <!-- State 5: Clear-gated feedback (dim, 2.5s) -->
  <div>
    <div class="state-label">State 5 — RC gate feedback (shown for 2.5s after tapping while gated)</div>
    <div class="estop-wrap">
      <button class="estop dim1">CYCLE RC CH3 TO CLEAR</button>
    </div>
  </div>

</div>
</body>
</html>
